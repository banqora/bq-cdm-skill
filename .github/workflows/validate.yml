name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly drift sweep: docs links, CDM release matrix, and upstream canary.
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  SHFMT_VERSION: v3.13.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o "$HOME/.local/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: shellcheck
        run: shellcheck -x skills/cdm-dev/scripts/cdm-source skills/cdm-dev/scripts/cdm-java-api skills/cdm-dev/scripts/cdm-inspect scripts/check-skill scripts/next-version tests/run tests/*.sh evals/run-triggers evals/run-quality evals/run-local
      - name: shfmt
        run: shfmt -d -i 2 -ci skills/cdm-dev/scripts/cdm-source skills/cdm-dev/scripts/cdm-java-api skills/cdm-dev/scripts/cdm-inspect scripts/check-skill scripts/next-version tests/run tests/*.sh evals/run-triggers evals/run-quality evals/run-local

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - name: Static gate
        run: scripts/check-skill --static

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - name: Script test suite
        run: tests/run

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external documentation links
        run: scripts/check-links

  cdm-matrix:
    # Proves the live contract on the latest release of every supported major,
    # so a skill edit that only holds on recent CDM fails here immediately.
    needs: [static, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cdm-version: ["4.3.0", "5.40.0", "6.24.0", "7.0.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - name: Cache cdm-java ${{ matrix.cdm-version }}
        id: cache-jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/cdm/cdm-java-${{ matrix.cdm-version }}.jar
          key: cdm-java-${{ matrix.cdm-version }}
      - name: Download cdm-java ${{ matrix.cdm-version }}
        if: steps.cache-jar.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/cdm
          curl -fsSL --retry 3 -o ~/.cache/cdm/cdm-java-${{ matrix.cdm-version }}.jar \
            "https://repo1.maven.org/maven2/org/finos/cdm/cdm-java/${{ matrix.cdm-version }}/cdm-java-${{ matrix.cdm-version }}.jar"
      - name: Live gate against cdm-java ${{ matrix.cdm-version }}
        run: scripts/check-skill --jar ~/.cache/cdm/cdm-java-${{ matrix.cdm-version }}.jar

  upstream-canary:
    # Early warning, not a merge gate: run the live contract against the newest
    # published cdm-java (including dev builds) and surface breakage in the
    # run summary before the release lands in the supported matrix.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - name: Resolve newest published cdm-java
        id: newest
        run: |
          version="$(curl -fsSL --retry 3 \
            https://repo1.maven.org/maven2/org/finos/cdm/cdm-java/maven-metadata.xml |
            grep -oE '<latest>[^<]+</latest>' | sed 's/<[^>]*>//g')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Newest published cdm-java: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Live gate against ${{ steps.newest.outputs.version }}
        run: |
          curl -fsSL --retry 3 -o /tmp/cdm-java-canary.jar \
            "https://repo1.maven.org/maven2/org/finos/cdm/cdm-java/${{ steps.newest.outputs.version }}/cdm-java-${{ steps.newest.outputs.version }}.jar"
          if scripts/check-skill --jar /tmp/cdm-java-canary.jar; then
            echo "Canary passed against ${{ steps.newest.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::skill contract drifted against upcoming cdm-java ${{ steps.newest.outputs.version }}"
            echo "Canary FAILED against ${{ steps.newest.outputs.version }} — the skill's model assumptions drift on the next CDM release." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  tag:
    # Every push to main that passes the full gate gets an immutable version
    # tag, so public consumers can pin a validated release. The patch number
    # auto-increments from the newest vX.Y.Z tag; push a vX.Y.0 tag by hand to
    # open a new minor/major series and auto-increment continues from it.
    # workflow_dispatch is included as the manual lever for a push whose event
    # was not delivered; an already tagged HEAD is skipped either way.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    needs: [lint, static, test, links, cdm-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag with the next patch version
        run: |
          set -euo pipefail
          if ! next="$(scripts/next-version)"; then
            status=$?
            if [ "$status" -eq 3 ]; then
              echo "HEAD already carries a release tag; skipping" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit "$status"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "cdm-dev $next"
          git push origin "refs/tags/$next"
          echo "Tagged $next" >> "$GITHUB_STEP_SUMMARY"
